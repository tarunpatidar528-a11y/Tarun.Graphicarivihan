<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Arivihan Graphic Gallery</title>

<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

<style>
*{box-sizing:border-box}
body{
    margin:0;
    font-family:Inter,Arial,sans-serif;
    background:#090b10;
    color:#fff;
}
header{
    height:72px;
    padding:0 24px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    border-bottom:1px solid #242833;
    background:#0d1016;
    position:sticky;
    top:0;
    z-index:20;
}
.logo{
    font-size:21px;
    font-weight:800;
}
.logo span{color:#5f8cff}
.header-actions{display:flex;gap:10px}
button{
    border:0;
    border-radius:10px;
    padding:11px 17px;
    background:#202631;
    color:#fff;
    cursor:pointer;
    font-weight:600;
}
button.primary{
    background:#5d8cff;
}
button:hover{filter:brightness(1.12)}

.layout{
    display:flex;
    min-height:calc(100vh - 72px);
}
.sidebar{
    width:245px;
    border-right:1px solid #242833;
    background:#0c0f15;
    padding:22px 16px;
}
.sidebar h3{
    margin:0 0 18px;
    font-size:13px;
    color:#8992a3;
    text-transform:uppercase;
}
.folder{
    display:flex;
    align-items:center;
    gap:10px;
    padding:12px;
    margin-bottom:6px;
    border-radius:10px;
    cursor:pointer;
}
.folder:hover,.folder.active{
    background:#1b2230;
}
.folder-count{
    margin-left:auto;
    color:#81899a;
    font-size:12px;
}
.add-folder{
    width:100%;
    margin-top:12px;
}

main{
    flex:1;
    padding:25px;
    min-width:0;
}
.topbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:15px;
    margin-bottom:20px;
}
.title h1{
    margin:0;
    font-size:28px;
}
.title p{
    margin:7px 0 0;
    color:#8d95a5;
}
.search{
    width:min(420px,100%);
    padding:13px 16px;
    border-radius:11px;
    border:1px solid #2b313d;
    outline:none;
    background:#11151d;
    color:#fff;
    font-size:15px;
}
.toolbar{
    display:flex;
    flex-wrap:wrap;
    gap:10px;
    margin-bottom:20px;
}
.status{
    color:#8f98a8;
    font-size:13px;
    margin:12px 0 18px;
}

.gallery{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(220px,1fr));
    gap:18px;
}
.card{
    background:#11151d;
    border:1px solid #252c38;
    border-radius:14px;
    overflow:hidden;
    transition:.2s;
}
.card:hover{
    transform:translateY(-2px);
    border-color:#46536a;
}
.thumb{
    width:100%;
    aspect-ratio:16/9;
    object-fit:cover;
    background:#171b23;
    display:block;
    cursor:pointer;
}
.card-body{
    padding:13px;
}
.card-title{
    font-weight:700;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}
.meta{
    color:#8992a2;
    font-size:12px;
    margin-top:6px;
}
.tags{
    display:flex;
    flex-wrap:wrap;
    gap:5px;
    margin-top:10px;
}
.tag{
    background:#1b2330;
    color:#9eb7ff;
    border-radius:6px;
    padding:4px 7px;
    font-size:11px;
}
.card-actions{
    display:flex;
    gap:7px;
    margin-top:12px;
}
.card-actions button{
    flex:1;
    padding:8px;
    font-size:12px;
}
.delete{background:#28191c}

.empty{
    padding:70px 20px;
    text-align:center;
    color:#7e8797;
    border:1px dashed #303744;
    border-radius:15px;
}
.empty strong{
    display:block;
    color:#fff;
    font-size:20px;
    margin-bottom:8px;
}

input[type=file]{display:none}

.modal{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.82);
    display:none;
    align-items:center;
    justify-content:center;
    z-index:100;
    padding:20px;
}
.modal.show{display:flex}
.viewer{
    max-width:95vw;
    max-height:94vh;
    position:relative;
}
.viewer img{
    max-width:95vw;
    max-height:88vh;
    object-fit:contain;
    border-radius:10px;
}
.close{
    position:absolute;
    top:-45px;
    right:0;
    background:#202631;
    border-radius:50%;
    width:38px;
    height:38px;
    padding:0;
    font-size:20px;
}

.progress-box{
    position:fixed;
    bottom:20px;
    right:20px;
    width:300px;
    background:#121720;
    border:1px solid #303846;
    padding:15px;
    border-radius:12px;
    display:none;
    z-index:200;
}
.progress-box.show{display:block}
.progress-bar{
    height:7px;
    background:#252c37;
    border-radius:10px;
    overflow:hidden;
    margin-top:10px;
}
.progress-fill{
    height:100%;
    width:0;
    background:#5d8cff;
}

@media(max-width:800px){
    .sidebar{
        width:190px;
    }
    main{padding:16px}
    .topbar{
        align-items:flex-start;
        flex-direction:column;
    }
    .search{width:100%}
}
@media(max-width:600px){
    header{padding:0 14px}
    .sidebar{width:150px;padding:15px 8px}
    .gallery{
        grid-template-columns:repeat(2,minmax(0,1fr));
        gap:10px;
    }
    .card-body{padding:9px}
    .title h1{font-size:22px}
}
</style>
</head>

<body>

<header>
    <div class="logo">ARIVIHAN <span>GRAPHIC GALLERY</span></div>

    <div class="header-actions">
        <label for="imageInput">
            <button class="primary" onclick="document.getElementById('imageInput').click()">
                + Add Images
            </button>
        </label>
        <input id="imageInput" type="file" accept="image/*" multiple>
    </div>
</header>

<div class="layout">

<aside class="sidebar">
    <h3>Library</h3>
    <div id="folders"></div>

    <button class="add-folder" onclick="createFolder()">+ Add Folder</button>
</aside>

<main>

<div class="topbar">
    <div class="title">
        <h1 id="pageTitle">Thumbnails · General</h1>
        <p>Shared-style graphic library with automatic text/date scanning</p>
    </div>

    <input
        id="searchInput"
        class="search"
        placeholder="Search thumbnail, text, date..."
    >
</div>

<div class="toolbar">
    <button onclick="sortImages('new')">Newest</button>
    <button onclick="sortImages('old')">Oldest</button>
    <button onclick="scanAll()">🔍 Scan Images</button>
</div>

<div class="status" id="status">
    0 images
</div>

<div id="gallery" class="gallery"></div>

</main>
</div>

<div id="viewerModal" class="modal" onclick="closeViewer(event)">
    <div class="viewer">
        <button class="close" onclick="hideViewer()">×</button>
        <img id="viewerImage">
    </div>
</div>

<div id="progressBox" class="progress-box">
    <div id="progressText">Scanning image...</div>
    <div class="progress-bar">
        <div id="progressFill" class="progress-fill"></div>
    </div>
</div>

<script>

const STORAGE_KEY = "arivihan_graphic_gallery_v2";

let state = {
    folders: ["General"],
    currentFolder: "General",
    images: []
};

function loadState(){
    try{
        const saved = localStorage.getItem(STORAGE_KEY);
        if(saved){
            state = JSON.parse(saved);
        }
    }catch(e){
        console.error(e);
    }

    if(!state.folders || !state.folders.length){
        state.folders=["General"];
    }

    if(!state.currentFolder){
        state.currentFolder="General";
    }

    renderFolders();
    renderGallery();
}

function saveState(){
    try{
        localStorage.setItem(STORAGE_KEY,JSON.stringify(state));
    }catch(e){
        alert("Browser storage full. Large images may need cloud storage.");
    }
}

function renderFolders(){

    const box=document.getElementById("folders");
    box.innerHTML="";

    state.folders.forEach(folder=>{

        const count=state.images.filter(
            x=>x.folder===folder
        ).length;

        const div=document.createElement("div");

        div.className=
            "folder "+
            (state.currentFolder===folder?"active":"");

        div.innerHTML=`
            <span>📁</span>
            <span>${escapeHTML(folder)}</span>
            <span class="folder-count">${count}</span>
        `;

        div.onclick=()=>{
            state.currentFolder=folder;
            document.getElementById("searchInput").value="";
            renderFolders();
            renderGallery();
        };

        box.appendChild(div);
    });
}

function createFolder(){

    const name=prompt("Folder name:");

    if(!name) return;

    const clean=name.trim();

    if(!clean) return;

    if(state.folders.includes(clean)){
        alert("Folder already exists.");
        return;
    }

    state.folders.push(clean);
    state.currentFolder=clean;

    saveState();
    renderFolders();
    renderGallery();
}

document.getElementById("imageInput").addEventListener(
    "change",
    async function(e){

        const files=[...e.target.files];

        if(!files.length) return;

        for(const file of files){

            if(!file.type.startsWith("image/")) continue;

            const id=
                Date.now()+"_"+Math.random()
                .toString(36)
                .slice(2);

            const dataURL=await fileToDataURL(file);

            const item={
                id,
                name:file.name,
                folder:state.currentFolder,
                data:dataURL,
                text:"",
                tags:[],
                date:new Date().toISOString(),
                scanned:false
            };

            state.images.unshift(item);

            renderGallery();
            saveState();

            // automatic scan
            scanImage(item);
        }

        e.target.value="";
    }
);

function fileToDataURL(file){

    return new Promise((resolve,reject)=>{

        const reader=new FileReader();

        reader.onload=()=>resolve(reader.result);
        reader.onerror=reject;

        reader.readAsDataURL(file);
    });
}

async function scanImage(item){

    showProgress("Scanning: "+item.name,10);

    try{

        const result=await Tesseract.recognize(
            item.data,
            "eng",
            {
                logger:m=>{
                    if(m.status==="recognizing text"){
                        showProgress(
                            "AI/OCR scanning: "+item.name,
                            Math.round(m.progress*100)
                        );
                    }
                }
            }
        );

        const text=(result.data.text||"").trim();

        item.text=text;
        item.tags=extractTags(text);
        item.scanned=true;

        saveState();
        renderGallery();

        hideProgress();

    }catch(err){

        console.error(err);

        item.scanned=true;

        saveState();
        renderGallery();

        hideProgress();
    }
}

function extractTags(text){

    const tags=[];

    const normalized=text
        .replace(/\n/g," ")
        .replace(/\s+/g," ")
        .trim();

    if(!normalized) return tags;

    const datePatterns=[

        /\b\d{1,2}\s+(?:jan|january|feb|february|mar|march|apr|april|may|jun|june|jul|july|aug|august|sep|sept|september|oct|october|nov|november|dec|december)\b/gi,

        /\b(?:jan|january|feb|february|mar|march|apr|april|may|jun|june|jul|july|aug|august|sep|sept|september|oct|october|nov|november|dec|december)\s+\d{1,2}\b/gi,

        /\b\d{1,2}[\/\-]\d{1,2}[\/\-]\d{2,4}\b/g,

        /\b\d{1,2}\s*August\b/gi,

        /\bAugust\s*\d{1,2}\b/gi
    ];

    datePatterns.forEach(pattern=>{

        const found=normalized.match(pattern);

        if(found){
            found.forEach(x=>{
                if(!tags.includes(x.trim())){
                    tags.push(x.trim());
                }
            });
        }
    });

    // Important educational/content keywords
    const keywords=[
        "NEET",
        "MP BOARD",
        "BIHAR BOARD",
        "UP BOARD",
        "CLASS 10",
        "CLASS 12",
        "CHEMISTRY",
        "PHYSICS",
        "BIOLOGY",
        "MATHS",
        "MATH",
        "HINDI",
        "ENGLISH",
        "15 AUGUST",
        "INDEPENDENCE DAY"
    ];

    keywords.forEach(keyword=>{

        if(normalized.toUpperCase().includes(keyword)){
            if(!tags.includes(keyword)){
                tags.push(keyword);
            }
        }
    });

    return tags;
}

function renderGallery(){

    const gallery=document.getElementById("gallery");

    const search=
        document.getElementById("searchInput")
        .value
        .trim()
        .toLowerCase();

    let images=state.images.filter(
        x=>x.folder===state.currentFolder
    );

    if(search){

        images=images.filter(x=>{

            const haystack=[
                x.name,
                x.text,
                ...(x.tags||[])
            ]
            .join(" ")
            .toLowerCase();

            return haystack.includes(search);
        });
    }

    document.getElementById("pageTitle").textContent=
        "Thumbnails · "+state.currentFolder;

    document.getElementById("status").textContent=
        `${images.length} image${images.length===1?"":"s"}`;

    if(!images.length){

        gallery.innerHTML=`
            <div class="empty" style="grid-column:1/-1">
                <strong>No images found</strong>
                Add thumbnails or change your search.
            </div>
        `;

        return;
    }

    gallery.innerHTML="";

    images.forEach(item=>{

        const card=document.createElement("div");

        card.className="card";

        const tags=(item.tags||[])
            .slice(0,8)
            .map(t=>`<span class="tag">${escapeHTML(t)}</span>`)
            .join("");

        const scanStatus=
            item.scanned
            ? "✓ Scanned"
            : "⏳ Scanning...";

        card.innerHTML=`

            <img
                class="thumb"
                src="${item.data}"
                alt="${escapeHTML(item.name)}"
            >

            <div class="card-body">

                <div class="card-title">
                    ${escapeHTML(item.name)}
                </div>

                <div class="meta">
                    ${scanStatus}
                </div>

                ${
                    tags
                    ? `<div class="tags">${tags}</div>`
                    : ""
                }

                <div class="card-actions">

                    <button class="view">
                        View
                    </button>

                    <button class="delete">
                        Delete
                    </button>

                </div>

            </div>
        `;

        card.querySelector(".thumb")
            .onclick=()=>showViewer(item.data);

        card.querySelector(".view")
            .onclick=()=>showViewer(item.data);

        card.querySelector(".delete")
            .onclick=()=>deleteImage(item.id);

        gallery.appendChild(card);
    });
}

document.getElementById("searchInput")
.addEventListener("input",renderGallery);

function deleteImage(id){

    if(!confirm("Delete this image?")) return;

    state.images=
        state.images.filter(x=>x.id!==id);

    saveState();
    renderFolders();
    renderGallery();
}

function showViewer(src){

    document.getElementById("viewerImage").src=src;

    document
        .getElementById("viewerModal")
        .classList.add("show");
}

function hideViewer(){

    document
        .getElementById("viewerModal")
        .classList.remove("show");
}

function closeViewer(e){

    if(e.target.id==="viewerModal"){
        hideViewer();
    }
}

document.addEventListener(
    "keydown",
    e=>{
        if(e.key==="Escape"){
            hideViewer();
        }
    }
);

function sortImages(type){

    if(type==="new"){

        state.images.sort(
            (a,b)=>new Date(b.date)-new Date(a.date)
        );

    }else{

        state.images.sort(
            (a,b)=>new Date(a.date)-new Date(b.date)
        );
    }

    saveState();
    renderGallery();
}

async function scanAll(){

    const images=state.images.filter(
        x=>!x.scanned
    );

    if(!images.length){

        alert("All images are already scanned.");
        return;
    }

    for(const item of images){

        await scanImage(item);

    }

    alert("All images scanned successfully.");
}

function showProgress(text,percent){

    const box=document.getElementById("progressBox");

    box.classList.add("show");

    document.getElementById("progressText")
        .textContent=text;

    document.getElementById("progressFill")
        .style.width=percent+"%";
}

function hideProgress(){

    document
        .getElementById("progressBox")
        .classList.remove("show");
}

function escapeHTML(value){

    return String(value||"")
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");
}

loadState();

</script>

</body>
</html>
